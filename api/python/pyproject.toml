[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "terp-proto"
version = "0.1.0"
description = "Python bindings for terp-core Cosmos SDK proto types"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "terp_proto._native"
python-source = "python"
