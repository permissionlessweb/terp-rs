[package]
name = "terp-recovery-poseidon-demo"
description = "Toy circuit demo pairing recovery PoseidonPallas digests with CosmWasm ZK verify pattern"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
default = []
# Wire deps.api.proof_instance_verify — requires cosmwasm-std/zk (same as terp-zkjwt).
zk-host = ["cosmwasm-std/zk"]

[dependencies]
cosmwasm-std = { workspace = true, features = ["std"] }
cosmwasm-schema = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
terp-recovery = { workspace = true, features = ["library"] }
hex = { workspace = true, features = ["alloc"] }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
