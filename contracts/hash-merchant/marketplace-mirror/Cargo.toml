# Isolated package so CosmWasm optimizer treats this directory as the project root.
[workspace]
members = ["."]

[package]
name = "marketplace-mirror"
version = "0.1.0"
edition = "2021"
description = "Nostr-mirrored marketplace inventory with hashmerchant sudo roots and buffer-escrow purchases"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[features]
library = []

[dependencies]
cosmwasm-schema = "2.3.2"
cosmwasm-std = { version = "2.3.2" }
cw-storage-plus = "2"
schemars = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "1"
