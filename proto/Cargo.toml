[package]
name = "terp-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable generated gRPC client/server code.
rpc = ["dep:tonic", "dep:tonic-prost"]
# Enable Python bindings via PyO3.
python = ["dep:pyo3", "dep:pythonize", "dep:serde_json"]

# The proto-gen binary — run with `cargo run --bin proto-gen` or `just gen`.
[[bin]]
name = "proto-gen"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Dependencies used by the proto-gen binary
# ---------------------------------------------------------------------------
[dependencies]
anyhow    = "1.0"
log       = "0.4"
walkdir   = "2.5"

# Build-time proto compilation tools (used by src/main.rs generator binary).
prost-build        = "0.14.3"
pbjson-build       = "0.9.0"
tonic-prost-build  = { version = "0.14.1" }

# ---------------------------------------------------------------------------
# Runtime dependencies for the generated library types
# ---------------------------------------------------------------------------
prost       = "0.14"
pbjson      = "0.9"
pbjson-types = "0.9"
serde       = { version = "1", features = ["derive"] }

# Optional: gRPC runtime (enabled with the `rpc` feature).
[dependencies.tonic]
version  = "0.14"
optional = true

[dependencies.tonic-prost]
version  = "0.14"
optional = true

# Optional: Python bindings (enabled with the `python` feature).
[dependencies.pyo3]
version  = "0.24"
features = ["extension-module"]
optional = true

[dependencies.pythonize]
version  = "0.24"
optional = true

[dependencies.serde_json]
version  = "1"
optional = true
