[package]
name = "terp-proto"
version = "0.1.0"
edition = "2024"
description = "protobuf definition and client libraries for Terp Network. build using `cargo run`."

[features]
default = []
# Enable generated gRPC client/server code.

[[bin]]
name = "proto-gen"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Dependencies used by the proto-gen binary
# ---------------------------------------------------------------------------
[dependencies]
anyhow    = "1.0"
walkdir   = "2.5"

# Build-time proto compilation tools (used by src/main.rs generator binary).
prost-build        = "0.14.3"
pbjson-build       = "0.9.0"
tonic-prost-build  = { version = "0.14.1" }
serde       = { version = "1", features = ["derive"] }
