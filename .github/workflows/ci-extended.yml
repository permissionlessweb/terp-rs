# Tier 1 — path / label gated. Contracts + more crates when those paths change.
# Also runnable via workflow_dispatch (maintainer) or label `ci-extended`.
name: CI Extended

on:
  pull_request:
    paths:
      - "contracts/**"
      - "crates/**"
      - "tests/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/ci-extended.yml"
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - "crates/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      full_contracts:
        description: "Also run heavier authenticator/zk contract tests"
        type: boolean
        default: false

concurrency:
  group: ci-extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Repo root on GHA is terp-rs; local act sets GITHUB_WORKSPACE via scripts/act.

jobs:
  # Skip draft PRs unless labeled ci-extended (saves minutes).
  should-run:
    name: decide
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
      heavy_contracts: ${{ steps.d.outputs.heavy_contracts }}
    steps:
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FULL: ${{ inputs.full_contracts }}
        run: |
          set -euo pipefail
          run=true
          heavy=false
          if [[ "$EVENT" == "pull_request" && "$DRAFT" == "true" ]]; then
            if [[ ",$LABELS," != *",ci-extended,"* && ",$LABELS," != *",ci-heavy,"* ]]; then
              run=false
            fi
          fi
          if [[ ",$LABELS," == *",ci-extended,"* || ",$LABELS," == *",ci-heavy,"* ]]; then
            heavy=true
          fi
          if [[ "$FULL" == "true" ]]; then
            heavy=true
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "heavy_contracts=$heavy" >> "$GITHUB_OUTPUT"
          echo "decide: run=$run heavy_contracts=$heavy"

  contracts-core:
    name: contracts (core authenticators)
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: contracts-core
      - name: Lib tests — authenticator-adjacent contracts
        run: |
          set -euo pipefail
          # Workspace members that are usually unit-testable without Docker.
          pkgs=(
            terp-ed25519
            terp-passkey
            terp-vsck
            terp-eth
            terp-irl
            terp-recovery
            terp-authenticator-suite
            cw-ics08-wasm-crosslink
          )
          for p in "${pkgs[@]}"; do
            echo "::group::cargo test -p $p --lib"
            cargo test -p "$p" --lib
            echo "::endgroup::"
          done
      - name: Wasm check (selected contracts)
        run: |
          set -euo pipefail
          # Compile-check for cosmwasm targets when the package supports it.
          for p in terp-ed25519 terp-passkey terp-vsck cw-ics08-wasm-crosslink; do
            echo "::group::wasm check $p"
            cargo check -p "$p" --target wasm32-unknown-unknown --lib || \
              cargo check -p "$p" --lib
            echo "::endgroup::"
          done

  contracts-heavy:
    name: contracts (zk / optional)
    needs: [should-run, contracts-core]
    if: needs.should-run.outputs.run == 'true' && needs.should-run.outputs.heavy_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: contracts-heavy
      - name: Optional zk-related packages
        run: |
          set -euo pipefail
          # May be heavy or feature-gated; fail the job if they break.
          pkgs=(
            terp-zkjwt
            terp-zkposiedon
            terp-recovery-poseidon-demo
          )
          for p in "${pkgs[@]}"; do
            echo "::group::cargo test -p $p --lib"
            cargo test -p "$p" --lib
            echo "::endgroup::"
          done

  scripts-integration:
    name: terp-scripts non-ignored integration
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: scripts-integration
      - uses: extractions/setup-just@v2
      - name: All non-ignored tests in terp-scripts
        run: |
          set -euo pipefail
          # Does not run #[ignore] (Docker harness stays in CI Heavy).
          cargo test -p terp-scripts --lib --tests
