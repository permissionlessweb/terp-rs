
[package]
name = "scripts"
version.workspace = true
edition.workspace = true
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[features]
default = ["docker", "nostr"]
docker = []
nostr = []
# dao = ["dep:dao-testing"]

[dependencies]
cosmwasm-std = { path = "../../cosmwasm/packages/std" }
# Chain orchestration
cw-orch = { path = "../../cw-orchestrator/cw-orch", features = ["daemon"] }

# Sub-suite crates
cw-headstash = { path = "../../headstash/contract/cw-headstash", features = ["interface"] }
cw-headstash-manifold = { path = "../../headstash/contract/manifold", features = ["interface"] }
cw-infuser-scripts = { path = "../../cw-infuser/scripts" }
dao-testing = { path = "../../dao-contracts/packages/dao-testing" }
shit-scripts = { path = "../../shitstrap/scripts/shit-scripts" }
terp-account-scripts = { path = "../../terp-account-billboards/scripts" }
zk-test-press = { path = "../../headstash/test-press", features = ["interface"] }

# Container lifecycle
ict-rs = { path = "../../ict-rs/ict-rs", features = ["docker", "terp", "testing", "nostr"] }
cw4 = { path = "../../cw-plus/packages/cw4" }

# CLI + runtime
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
env_logger = "0.11"
hex = "0.4"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"


# Override transitive git deps from zk-cosmwasm with local paths
