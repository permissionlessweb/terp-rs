# hash-market-server configuration

# Address to bind the HTTP API
bind = "0.0.0.0:9090"

# CometBFT chain ID
chain_id = "terp-mainnet-1"

# Secp256k1 private key (hex-encoded, 32 bytes)
# Generate with: openssl rand -hex 32
signing_key = "deadbeef..."

# ── Providers ─────────────────────────────────────────────────────────
#
# Each [[providers]] entry registers a named data source for a specific
# (chain_uid, algo) pair. Multiple providers can run concurrently, each
# with its own transport.
#
# Fields:
#   name          — human-readable label (for logs and /providers endpoint)
#   chain_uid     — must match a RegisteredChain in the hashmerchant module
#   algo          — hash algorithm (default: "keccak256")
#   mode          — transport: "grpc", "http_poll", or "websocket"
#   address       — listen addr (grpc) or remote URL (http_poll, websocket)
#   interval_secs — polling interval for http_poll (default: 12)

[[providers]]
name = "ethereum-mainnet"
chain_uid = "ethereum-mainnet"
algo = "keccak256"
mode = "grpc"
address = "0.0.0.0:9091"

[[providers]]
name = "arbitrum-one"
chain_uid = "arbitrum-one"
algo = "keccak256"
mode = "grpc"
address = "0.0.0.0:9092"

