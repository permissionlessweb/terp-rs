[workspace]

[package]
name = "headstash-server"
version = "0.1.0"
edition = "2021"
description = "Privacy note + circuit key server for the MetaMask snap"

[dependencies]
anyhow = "1"
hex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
blake3 = "1"
sha2 = "0.10"

# secp256k1 auth
k256 = { version = "0.13", features = ["ecdsa"] }

# JWT auth
jsonwebtoken = "9"
