version: "2.0"

services:
  merkle-server:
    image: ghcr.io/terpnetwork/merkle-server:0.1.0
    expose:
      - port: 80
        as: 80
        to:
          - global: true
    env:
      # Required: 66-char hex compressed secp256k1 public key
      # Generate with: merkle-server keygen
      - "MERKLE_PUBLIC_KEY=<your_pubkey_here>"
      # Required: your Cloudflare DNS hostname for this deployment
      - "DOMAIN=merkle.example.com"
      # Optional overrides
      # - "MERKLE_DATA_DIR=/app/data"
      # - "MERKLE_PORT=8765"
      # - "MERKLE_TOLERANCE=300"
    params:
      storage:
        data:
          mount: /app/data
          readOnly: false

profiles:
  compute:
    merkle-server:
      resources:
        cpu:
          units: 0.25
        memory:
          size: 256Mi
        storage:
          - size: 512Mi
          - name: data
            size: 1Gi
            attributes:
              persistent: true
              class: beta2
  placement:
    akash:
      pricing:
        merkle-server:
          denom: uakt
          amount: 1000

deployment:
  merkle-server:
    akash:
      profile: merkle-server
      count: 1
