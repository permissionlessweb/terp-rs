[package]
name = "merkle-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "merkle-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# secp256k1 ECDSA — matches Cosmos key format
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6.8", features = ["cors"] }
# Blake3 — same hash function as the whitelist contract
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
once_cell = "1"
