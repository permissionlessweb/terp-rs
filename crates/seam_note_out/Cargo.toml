[package]
name = "seam_note_out"
version = "0.1.0"
edition = "2021"
description = "Pure structural SEAM-NOTE-OUT (SeamNoteOutV0) + encrypt envelope + SEAM-N1..N6 tests"
publish = false

[features]
default = []
## Thin blocking HTTP for HeadstashStore notes (reqwest).
http = ["dep:reqwest"]
## Snap secp256k1 auth header signing (wallet/CLI).
auth = ["dep:k256"]
## Full ops CLI: live notes_base + blossom/snap auth + recover.
cli = ["http", "auth", "dep:clap"]

[[bin]]
name = "headstash-notes"
path = "src/bin/headstash_notes.rs"
required-features = ["cli"]

[dependencies]
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
k256 = { version = "0.13", features = ["ecdsa", "sha256"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }

[lib]
path = "src/lib.rs"
