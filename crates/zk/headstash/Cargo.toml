[workspace]
resolver = "2"
members = [
    "circuit",
    "contract/cw-headstash",
    "contract/manifold",
    "test-press",
    "test-press/src/circuits/no-rick",
]
exclude = [
    # Minimal stub — include when ready
    "contract/cw-headstash/scripts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# ── Internal workspace crates ──────────────────────────────────────────────
zk-headstash          = { path = "circuit" }
cw-headstash          = { path = "contract/cw-headstash" }
cw-headstash-manifold = { path = "contract/manifold" }

# ── ZK / halo2 (local path — permissionlessweb fork, mvp branch) ──────────
# From crates/zk/headstash/ to ~/ZK/zcash/halo2/
halo2_proofs  = { path = "../../../../zcash/halo2/halo2_proofs", default-features = false }
halo2_gadgets = { path = "../../../../zcash/halo2/halo2_gadgets" }
halo2-base    = {   path = "../../../../zcash/halo2-lib/halo2-base" }

# ── ZK companion crates ───────────────────────────────────────────────────
# zk-cosmwasm: the no-rick crate is the zk circuit contract — wired via `package` rename
# so dependents can `use zk_cosmwasm::*` while the crate lives at no-rick.
zk-cosmwasm      = { path = "test-press/src/circuits/no-rick", package = "no-rick" }
headstash-randomness = { path = "../../public/randomness" }

# ── Sinsemilla / zcash ecosystem (crates.io) ──────────────────────────────
sinsemilla  = "0.1"
zcash_spec  = "0.2"
reddsa      = "0.5"
zip32       = "0.2"
memuse      = "0.2"

# ── Crypto / math ─────────────────────────────────────────────────────────
ff           = "0.13"
group        = "0.13"
pasta_curves = "=0.5.1"
bitvec       = "1"
blake2b_simd = "1"
blake3       = "1"
subtle       = "2"
num-bigint   = "0.4"
num-traits   = "0.2"
fpe          = "0.6"
secp256k1    = "0.31"

# ── Protobuf / gRPC ───────────────────────────────────────────────────────
prost       = "0.14.3"
tonic       = "0.14.4"
tonic-prost = "0.14"
rayon      = "1"
rand       = "0.8"
base64     = "0.22"
hex        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Utility ───────────────────────────────────────────────────────────────
core2       = "0.3"
lazy_static = "1"
nonempty    = "0.10"
getset      = "0.1"
visibility  = "0.1"
anyhow      = "1"
sha2        = "0.10"
proptest    = ">=1.0.0, <1.7.0"
tracing     = "0.1"

# ── CosmWasm (2.x — contracts use cosmwasm_2_0 feature) ──────────────────
cosmwasm-std    = "3.0.4"
cosmwasm-schema = "3.0.4"
cw-storage-plus = "3.0.1"
cw-ownable = { version = "3.0.1", git = "https://github.com/permissionlessweb/cw-plus-plus" }
cw-multi-test   = "3.0.1"

# ── cw-orch (local path — abstract/cw-orchestrator, matches ict-rs-cw-orch) ─
# From crates/zk/headstash/ to ~/abstract/cw-orchestrator/
cw-orch = { path = "../../../../../abstract/cw-orchestrator/cw-orch" }

# ── ict-rs (for ZkWasmVmSuite impls in test-press) ────────────────────────
# From crates/zk/headstash/ to crates/public/ict-rs/ict-rs/
ict-rs = { path = "../../public/ict-rs/ict-rs" }

# ── Terp smart-account packages ───────────────────────────────────────────
# From crates/zk/headstash/ to crates/public/terp-account-billboards/
terp-account = { path = "../../public/terp-account-billboards/packages/terp-account" }
terp-auth    = { path = "../../public/terp-account-billboards/packages/terp-auth" }
