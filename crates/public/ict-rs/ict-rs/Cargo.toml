[package]
name = "ict-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust re-implementation of the Interchain Test framework"

[features]
default = ["docker"]
full = ["docker", "ethereum", "testing", "terp"]
docker = ["dep:bollard"]
kuasar = ["dep:tonic"]
testing = []
ethereum = ["dep:sha3"]
# Chain module features
terp = ["tokenfactory", "feeshare", "drip", "clock", "hashmerchant", "smartaccount", "globalfee"]
tokenfactory = []
feeshare = []
drip = []
clock = []
hashmerchant = []
smartaccount = []
globalfee = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Cosmos types
cosmrs = { version = "0.21", features = ["cosmwasm", "grpc"] }
tendermint = "0.40"
tendermint-rpc = { version = "0.40", features = ["http-client"] }
prost = "0.14"
tonic = { version = "0.12", optional = true }

# Docker (default backend)
bollard = { version = "0.18", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto & keys
bip32 = "0.5"
bip39 = { version = "2", features = ["default"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = { version = "0.10", optional = true }
ripemd = "0.1"

# Utilities
tracing = "0.1"
rand = "0.8"
hex = "0.4"
bech32 = "0.11"
toml = "0.8"

# Derive macros
ict-rs-derive = { path = "../ict-rs-derive" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
bip39 = { version = "2", features = ["default"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "runtime_bench"
harness = false

[[example]]
name = "basic_cosmos"
path = "../examples/basic_cosmos.rs"

[[example]]
name = "ibc_transfer"
path = "../examples/ibc_transfer.rs"

[[example]]
name = "ibc_transfer_e2e"
path = "../examples/ibc_transfer_e2e.rs"

[[example]]
name = "integration_test"
path = "../examples/integration_test.rs"

[[example]]
name = "ibc_hooks"
path = "../examples/ibc_hooks.rs"

[[example]]
name = "hashmerchant"
path = "../examples/hashmerchant.rs"
required-features = ["docker", "ethereum", "hashmerchant"]

[[example]]
name = "pfm"
path = "../examples/pfm.rs"

[[example]]
name = "polytone"
path = "../examples/polytone.rs"

[[example]]
name = "cosmos_upgrade"
path = "../examples/cosmos_upgrade.rs"
required-features = ["docker"]

[[example]]
name = "no_rick"
path = "../examples/no_rick.rs"
required-features = ["docker"]
