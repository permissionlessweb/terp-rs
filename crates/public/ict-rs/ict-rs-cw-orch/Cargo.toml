[package]
name = "ict-rs-cw-orch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bridge between ict-rs and cw-orchestrator: spawn local chains via ict-rs, interact via cw-orch Daemon"

[dependencies]
ict-rs = { path = "../ict-rs", features = ["docker"] }
cw-orch-core = "2.1"
cw-orch-daemon = "0.29"

tokio = { version = "1", features = ["rt"] }
thiserror = "2"
tracing = "0.1"
