[package]
name = "cw721-nips"
version = "0.1.0"
edition = "2021"
description = "Nostr NIP library with cw721-trait-based metadata system"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8.22"
cosmwasm-schema  = { path = "../../../../cosmwasm/packages/schema", optional = true }
cosmwasm-std = { path = "../../../../cosmwasm/packages/std", optional = true }
cw721 = { path = "../../../../cw-nfts/packages/cw721", optional = true }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
thiserror = "1.0"

[features]
default = ["cw","nip01", "nip15", "nip52"]
nip01 = []
nip15 = []
nip52 = []
cw = ["dep:cosmwasm-std","dep:cosmwasm-schema", "dep:cw721"]
full = ["nip01", "nip15", "nip52"]
