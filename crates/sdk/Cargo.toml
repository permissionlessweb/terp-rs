[package]
name = "terp-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ibc"]
ibc = [
    "dep:ibc-types",
    "dep:ibc-proto",
    "dep:ibc-app-transfer-types",
    "dep:ibc-app-nft-transfer-types",
    "dep:ibc-client-wasm-types",
]
# Enable generated gRPC client/server code.
rpc = ["dep:tonic", "dep:tonic-prost"]
# Enable Python bindings via PyO3.
python = ["dep:pyo3", "dep:serde_json"]

# ---------------------------------------------------------------------------
# Dependencies used by the proto-gen binary
# ---------------------------------------------------------------------------
[dependencies]
anyhow    = "1.0"
bytes = "1.11.1"
ibc-app-nft-transfer-types = { path = "../../../ibc-rs/ibc-apps/ics721-nft-transfer/types", optional = true }
ibc-app-transfer-types = { path = "../../../ibc-rs/ibc-apps/ics20-transfer/types", optional = true }
ibc-client-wasm-types = { path = "../../../ibc-rs/ibc-clients/ics08-wasm/types", optional = true }
ibc-proto = { path = "../../../ibc-proto-rs", optional = true }
ibc-types = { path = "../../../ibc-types/crates/ibc-types", optional = true }
pbjson-types = "0.9"

# ---------------------------------------------------------------------------
# Runtime dependencies for the generated library types
# ---------------------------------------------------------------------------
prost       = "0.14"
serde       = { version = "1", features = ["derive"] }

# Optional: Python bindings (enabled with the `python` feature).
[dependencies.pyo3]
version  = "0.24"
features = ["extension-module"]
optional = true

[dependencies.serde_json]
version  = "1"
optional = true
# Optional: gRPC runtime (enabled with the `rpc` feature).
[dependencies.tonic]
version  = "0.14"
optional = true

[dependencies.tonic-prost]
version  = "0.14"
optional = true

[patches.crates-io]

